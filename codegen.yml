overwrite: true
schema: ${GRAPHQL_API_URL:http://localhost:4002}/graphql
documents:
  - 'app/**/*.{js,jsx,ts,tsx}'
  - '!app/**/*.test.{js,jsx,ts,tsx}'
  - '!app/**/*.spec.{js,jsx,ts,tsx}'
config:
  skipDocumentsValidation: true
generates:
  app/API/types/generated.ts:
    plugins:
      - typescript
      - typescript-operations
    config:
      scalars:
        ID: string
        NaiveDateTime: string
        Upload: File
      maybeValue: 'T | null'
      dedupeOperationSuffix: true
      dedupeFragments: true
