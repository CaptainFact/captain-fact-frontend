<!doctype html>
<html>
  <!-- prettier-ignore -->
  <head lang="en">
  <!-- Metadata -->
  <title>CaptainFact</title>
  <meta charset="utf-8">
  <meta name="description" content="Collaborative, real-time fact checking. Free and open source.">
  <meta name="keywords" content="fact checking,wiki,collaborative">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
  <link rel="manifest" href="/favicons/manifest.json">
  <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#5bbad5">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="msapplication-config" content="/favicons/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <!-- Web extensions -->
  <link rel="chrome-webstore-item" href="https://chrome.google.com/webstore/detail/fnnhlmbnlbgomamcolcpgncflofhjckm">
  <!-- Runtime env variables -->
  <script>
    window.CF_GLOBALS = {};
  </script>
  <!-- End runtime env variables -->
  
  <!-- Initialize theme before React loads to prevent flash -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme') || 'auto';
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else if (theme === 'light') {
          root.classList.remove('dark');
        } else {
          // Auto mode: check prefers-color-scheme
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefersDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        }
      } catch (e) {
        // Ignore errors
      }
    })();
  </script>

  <!-- Preloading frame base style (without animation) -->
  <style>
    #preloading-frame {
      position: relative;
      padding-top: 20vh;
      text-align: center;
      font-size: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    html.dark body {
      color: #fff;
      background-color: hsl(0 0% 9%);
    }

    @keyframes animated-logo {
      0% {
        transform: perspective(120px) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateY(-180deg);
      }

      100% {
        transform: perspective(120px) rotateY(-360deg);
      }
    }

    .animated-logo {
      animation: animated-logo 3s ease infinite;
    }
  </style>
</head>

  <body>
    <div id="app">
      <!-- The content -->
      <div id="preloading-frame">
        <img src="/assets/img/logo.svg" width="150" class="animated-logo" />
        <p>Loading...</p>
        <noscript>Your browser does not support JavaScript!</noscript>
      </div>
    </div>

    <!-- Detect locale and show localized loading text -->
    <script>
      (function() {
        try {
          // Supported locales
          const SUPPORTED_LOCALES = ['fr', 'en', 'ar', 'es', 'pt_BR', 'eo', 'ru'];
          
          // Loading translations
          const loadingTexts = {
            'en': 'Loading…',
            'fr': 'Chargement…',
            'ar': 'جارٍ التحميل',
            'es': 'Cargando…',
            'pt_BR': 'Carregando…',
            'eo': 'Ŝarĝo…',
            'ru': 'Загрузка…'
          };
          
          // Get locale from localStorage or browser
          let locale = null;
          
          // Try localStorage first
          try {
            const stored = localStorage.getItem('preferences');
            if (stored) {
              const prefs = JSON.parse(stored);
              if (prefs.locale && SUPPORTED_LOCALES.includes(prefs.locale)) {
                locale = prefs.locale;
              }
            }
          } catch (e) {
            // Fall through to browser locale
          }
          
          // If no locale from localStorage, try browser locale
          if (!locale) {
            try {
              const browserLang = (navigator.userLanguage || navigator.language || 'en').split('-')[0].toLowerCase();
              if (SUPPORTED_LOCALES.includes(browserLang)) {
                locale = browserLang;
              } else {
                locale = 'en'; // default fallback
              }
            } catch (e) {
              locale = 'en'; // default fallback
            }
          }
          
          // Update loading text
          const loadingElement = document.querySelector('#preloading-frame p');
          if (loadingElement && loadingTexts[locale]) {
            loadingElement.textContent = loadingTexts[locale];
          }
        } catch (e) {
          // Ignore errors, keep default "Loading..."
        }
      })();
    </script>
  </body>
</html>
