name: E2E/Integration tests

on: [push]

env:
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

jobs:
  cypress:
    runs-on: ubuntu-22.04 # Remember to update this when changing Erlang version. See https://github.com/erlef/setup-beam
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: captain_fact_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Checkout
      # Try to use the API branch matching the frontend branch so co-developed changes
      # are tested together. Fall back to staging when no matching branch exists.
      - name: Checkout API (matching branch)
        id: checkout-api
        uses: actions/checkout@v3
        continue-on-error: true
        with:
          repository: CaptainFact/captain-fact-api
          ref: ${{ github.ref_name }}
          path: api
      - name: Checkout API (staging fallback)
        if: steps.checkout-api.outcome == 'failure'
        uses: actions/checkout@v3
        with:
          repository: CaptainFact/captain-fact-api
          ref: refs/heads/staging
          path: api
      - name: Checkout Frontend
        uses: actions/checkout@v2
        with:
          repository: CaptainFact/captain-fact-frontend
          path: frontend
      # Setup API
      - name: Restore Elixir cache
        uses: actions/cache@v4
        with:
          path: ./api/deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-
            ${{ runner.os }}-mix-
      - name: Restore Elixir build folder
        uses: actions/cache@v4
        with:
          path: ./api/build
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-
            ${{ runner.os }}-mix-
      - uses: erlef/setup-beam@v1
        with:
          version-file: ./api/.tool-versions
          version-type: strict
      - name: Install API's dependencies
        working-directory: api
        run: mix deps.get
      - name: Compile dependencies
        working-directory: api
        run: mix deps.compile
      - name: Compile project
        working-directory: api
        run: mix compile
      - name: Prepare DB
        working-directory: api
        run: mix ecto.create && mix ecto.migrate && mix ecto.seed
      # Setup Frontend
      - uses: actions/setup-node@v3
        with:
          node-version-file: './frontend/.tool-versions'
          cache-dependency-path: './frontend/package-lock.json'
          cache: 'npm'
      - name: Install Frontend's dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      # Run tests
      - name: Start E2E tests
        working-directory: api
        run: ./scripts/run_e2e_ci.sh
      # Upload Cypress artifacts
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore
